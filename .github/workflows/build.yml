name: Build and publish InkBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      signed_apk: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Detect Android release signing key
        id: signing
        shell: bash
        env:
          INKBRIDGE_KEYSTORE_BASE64: ${{ secrets.INKBRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$INKBRIDGE_KEYSTORE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Android signing key configured. Building a debug APK only; no auto-update Release will be published."
          fi

      - name: Restore private signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          INKBRIDGE_KEYSTORE_BASE64: ${{ secrets.INKBRIDGE_KEYSTORE_BASE64 }}
        run: |
          echo "$INKBRIDGE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inkbridge-release.jks"
          test -s "$RUNNER_TEMP/inkbridge-release.jks"

      - name: Build signed Android APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          INKBRIDGE_KEYSTORE_PATH: ${{ runner.temp }}/inkbridge-release.jks
          INKBRIDGE_STORE_PASSWORD: ${{ secrets.INKBRIDGE_STORE_PASSWORD }}
          INKBRIDGE_KEY_PASSWORD: ${{ secrets.INKBRIDGE_KEY_PASSWORD }}
          INKBRIDGE_KEY_ALIAS: ${{ secrets.INKBRIDGE_KEY_ALIAS }}
        run: |
          gradle --no-daemon :android-app:assembleRelease \
            -PinkbridgeVersionCode="$GITHUB_RUN_NUMBER" \
            -PinkbridgeVersionName="0.2.$GITHUB_RUN_NUMBER"

      - name: Build debug APK (until release signing is configured)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          gradle --no-daemon :android-app:assembleDebug \
            -PinkbridgeVersionCode="$GITHUB_RUN_NUMBER" \
            -PinkbridgeVersionName="0.2.$GITHUB_RUN_NUMBER"

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: InkBridge-Android-APK
          path: android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: InkBridge-Android-APK-debug-only
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows companion EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish windows-companion/InkBridge.Companion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=0.2.${{ github.run_number }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output publish

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: InkBridge-Windows-x64
          path: publish/InkBridge.Companion.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish update release
    needs: [android, windows]
    if: >-
      needs.android.outputs.signed_apk == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Android APK
        uses: actions/download-artifact@v8
        with:
          name: InkBridge-Android-APK
          path: android

      - name: Download Windows EXE
        uses: actions/download-artifact@v8
        with:
          name: InkBridge-Windows-x64
          path: windows

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/*.apk release-assets/InkBridge-Android.apk
          cp windows/InkBridge.Companion.exe release-assets/InkBridge.Companion.exe
          cd release-assets
          sha256sum InkBridge-Android.apk InkBridge.Companion.exe > SHA256SUMS.txt

      - name: Publish this build as the latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: InkBridge v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/InkBridge-Android.apk
            release-assets/InkBridge.Companion.exe
            release-assets/SHA256SUMS.txt
